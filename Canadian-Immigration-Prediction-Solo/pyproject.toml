[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immigration-forecast"
version = "0.1.0"
description = "Forecast monthly Canadian permanent resident admissions from official IRCC open data."
authors = [{ name = "Nachiket Prajapati", email = "prajapatinachiket@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["lightgbm>=4.0", "scikit-learn>=1.3"]
foundation = ["timesfm[torch]>=3.0"]
gcp = ["google-cloud-bigquery>=3.20", "db-dtypes", "google-genai>=1.0"]
all = ["immigration-forecast[dev,ml,foundation,gcp]"]

[project.scripts]
immigration-forecast = "immigration_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
