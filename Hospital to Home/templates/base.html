<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hospital → Home{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <a class="brand" href="{{ url_for('index') }}">
          <span class="brand-icon"><i class="bi bi-hospital"></i></span>
          Hospital → Home
        </a>
        <span class="tagline d-none d-md-inline">
          <i class="bi bi-graph-up-arrow me-1"></i>Predictive
          <span class="mx-2">•</span><i class="bi bi-clipboard2-pulse me-1"></i>Shared Plan
          <span class="mx-2">•</span><i class="bi bi-bell me-1"></i>Notifications
        </span>
      </div>
      {% block header %}{% endblock %}
    </div>
  </header>

  <main class="container page pb-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="container pb-4 text-center">
    Hospital-to-Home Predictive Monitoring • Demo data only — not for clinical use
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
